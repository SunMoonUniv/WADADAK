name: Backend CI

# 워크플로 경로 필터(on.paths)는 두지 않는다. 걸러진 PR은 필수 체크가 Pending에 막힌다.
# 대신 changes 작업이 바뀐 파일을 보고, 서버가 그대로면 backend · deploy를 건너뛴다. 건너뛴 작업은 필수 체크에서 통과로 친다.
on:
  pull_request:
  push:
    branches: [main]
  # 공용 서버를 다시 띄울 때(서버 PC 재설치 등) Actions 화면에서 main으로 실행한다.
  workflow_dispatch:

jobs:
  changes:
    name: 변경 감지
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PR은 base 브랜치와, main push는 직전 커밋과 비교한다. 수동 실행은 비교할 커밋이 없다.
      # run/fixtures는 서버 테스트가 읽는다. git이 실패하면 바뀐 것으로 본다.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          git diff --quiet "$BASE" HEAD -- BackEnd deploy run/fixtures .github/workflows/backend.yml && changed=false || changed=true
          echo "backend=$changed" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    # 'false'일 때만 건너뛴다. changes 작업이 실패해도 돈다. 수동 실행은 항상 돈다.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # verify(), 모듈 단독 기동 테스트 포함. Testcontainers는 러너의 Docker를 쓴다.
      - run: ./gradlew test

  # main 커밋의 core · run 이미지를 GitHub 러너에서 한 번 빌드해 GHCR에 올린다(MSA 분리 준비와 CI·CD 8.1). PR에서는 돌지 않는다.
  # 태그는 :main과 :커밋SHA. 서버는 :main을 받고, 되돌릴 때는 SHA 태그를 쓴다.
  # 그 서비스 코드가 그대로면 캐시로 같은 이미지가 나와 서버가 그 컨테이너를 다시 띄우지 않는다.
  # provenance(빌드 시각이 든 출처 정보)를 붙이면 매번 다른 이미지가 되어 꺼 둔다.
  images:
    needs: backend
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [core, run]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: BackEnd
          file: BackEnd/services/${{ matrix.service }}/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/sunmoonuniv/wadadak-${{ matrix.service }}:main
            ghcr.io/sunmoonuniv/wadadak-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # core 서버 PC(러너 wadadak-core). 제공하는 쪽(브로커 · 내부 API)을 먼저 띄운다. 서버 PC 준비·보안 설정은 deploy/README.md.
  deploy:
    needs: images
    # 환경 · 동시 실행 그룹 · compose 프로젝트 이름은 wadadak-server 그대로다(Secrets · 볼륨이 그 이름에 묶여 있다).
    runs-on: [self-hosted, wadadak-core]
    # 비밀값은 이 환경의 Secrets에 둔다. 환경의 배포 브랜치를 main으로 묶어 다른 브랜치·PR은 읽지 못한다.
    environment: wadadak-server
    # 배포는 한 번에 하나. 밀린 배포는 가장 최근 것만 남는다.
    concurrency:
      group: wadadak-server
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: cmd
    steps:
      # 기본 정리(git clean -ffdx)는 git이 무시하는 utilfile/(서버에 직접 둔 공공데이터 · 길찾기 파일)까지 지운다.
      # 정리는 끄고, 다음 단계에서 utilfile/만 빼고 같은 정리를 한다.
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: 작업 폴더 정리 (utilfile 제외)
        run: git clean -ffdx -e /utilfile/
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 다른 이미지(cloudflared:latest 등)는 받지 않는다. compose pull은 전부 받아 바뀌지 않은 서비스까지 다시 띄운다.
      - name: core 이미지 받기
        run: docker pull ghcr.io/sunmoonuniv/wadadak-core:main
      # 바뀐 서비스만 교체하고 healthy가 될 때까지 기다린다. 서버가 못 뜨면 이 작업이 실패한다.
      - name: 서버 교체
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          BROKER_PASSWORD: ${{ secrets.BROKER_PASSWORD }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          # FCM 키가 없으면 빈 값을 넘겨 푸시를 로그로만 남긴다. 'base64:'만 넘기면 서버가 빈 키를 읽다 뜨지 않는다.
          FCM_CREDENTIALS_LOCATION: ${{ secrets.FCM_SERVICE_ACCOUNT != '' && format('base64:{0}', secrets.FCM_SERVICE_ACCOUNT) || '' }}
          # 코스 자동 생성의 장소 검색 키. 없으면 빈 값이 넘어가 장소 입력만 못 찾는다.
          NAVER_SEARCH_CLIENT_ID: ${{ secrets.NAVER_SEARCH_CLIENT_ID }}
          NAVER_SEARCH_CLIENT_SECRET: ${{ secrets.NAVER_SEARCH_CLIENT_SECRET }}
          NAVER_GEOCODE_CLIENT_ID: ${{ secrets.NAVER_GEOCODE_CLIENT_ID }}
          NAVER_GEOCODE_CLIENT_SECRET: ${{ secrets.NAVER_GEOCODE_CLIENT_SECRET }}
          # 문장 → 폼 보충용 Jev 키. 없으면 서버는 규칙만 쓴다.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # 운영자 웹 공용 계정. 없으면 운영자 API만 401이다.
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # 터널 토큰을 넣기 전(도메인 준비 전)에는 cloudflared 없이 띄운다.
          COMPOSE_PROFILES: ${{ secrets.TUNNEL_TOKEN != '' && 'tunnel' || '' }}
        run: docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 300 --remove-orphans
      # compose는 붙인 파일(deploy/Caddyfile)이 바뀐 것을 모른다. 바뀌었으면 연결을 끊지 않고 새 설정을 쓰고, 그대로면 아무것도 안 한다.
      - name: 게이트웨이 설정 다시 읽기
        run: docker exec wadadak-server-gateway-1 caddy reload --config /etc/caddy/Caddyfile
      - name: 이전 이미지 정리
        run: docker image prune -f

  # run 서버 PC(러너 wadadak-run). core PC 다음에 띄운다(브로커 · core 내부 API가 그쪽에 있다).
  deploy-run:
    needs: deploy
    runs-on: [self-hosted, wadadak-run]
    # run 비밀값만 둔다(RUN_DB_PASSWORD · BROKER_PASSWORD · JWT_PUBLIC_KEY). JWT 개인키 · core DB 비밀번호는 없다.
    environment: wadadak-run
    concurrency:
      group: wadadak-run
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: run 이미지 받기
        run: docker pull ghcr.io/sunmoonuniv/wadadak-run:main
      - name: run 교체
        env:
          RUN_DB_PASSWORD: ${{ secrets.RUN_DB_PASSWORD }}
          BROKER_PASSWORD: ${{ secrets.BROKER_PASSWORD }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        run: docker compose -f deploy/run/compose.yaml up -d --wait --wait-timeout 300 --remove-orphans
      - name: 이전 이미지 정리
        run: docker image prune -f

  # 밖에서 들어오는 길(gateway)을 거쳐 두 서비스에 닿는지 본다. 서비스가 healthy여도 gateway 설정이 틀리면 502다(2026-11-17).
  smoke:
    needs: deploy-run
    runs-on: [self-hosted, wadadak-core]
    defaults:
      run:
        shell: cmd
    steps:
      - name: core (gateway 경유 health 200)
        run: docker exec wadadak-server-gateway-1 wget -q -O /dev/null http://127.0.0.1:8080/actuator/health
      # 토큰 없이 부르면 run이 401로 답한다. 502 · 504면 run PC까지 못 간 것이다.
      - name: run (gateway 경유 401)
        run: docker exec wadadak-server-gateway-1 sh -c "wget -S -O /dev/null http://127.0.0.1:8080/api/v1/runs/records 2>&1 | grep -q ' 401 '"
