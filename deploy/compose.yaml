# core 서버 PC 실행 구성(러너 wadadak-core). 절차는 deploy/README.md. run 서비스는 run 서버 PC에서 뜬다(deploy/run/compose.yaml).
# 두 PC는 Tailscale 사설망으로 잇는다(MSA 분리 준비와 CI·CD 2.3). core PC 100.75.79.15, run PC 100.73.249.33.
# run이 쓰는 postgres · rabbitmq · core 포트는 core PC의 Tailscale 주소에만 연다. 학교 LAN이나 밖에서는 닿지 않는다.
# 비밀값(DB_PASSWORD · RUN_DB_PASSWORD · JWT_* · STORAGE_SECRET_KEY · BROKER_PASSWORD · TUNNEL_TOKEN · FCM_SERVICE_ACCOUNT · NAVER_* · TYPESAFE_API_KEY · ADMIN_*)은 배포 작업(backend.yml deploy)이 GitHub Secrets에서 환경 변수로 넘긴다.
# 서버 PC에는 비밀값 파일을 두지 않는다.
name: wadadak-server

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: wadadak
      POSTGRES_USER: wadadak
      POSTGRES_PASSWORD: ${DB_PASSWORD:?GitHub Secrets에 DB_PASSWORD가 없다}
    # run PC의 run 서비스(run 전용 계정 wadadak_run)만 Tailscale로 붙는다. 다른 서비스는 compose 안에서 붙는다.
    ports:
      - "100.75.79.15:5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wadadak -d wadadak"]
      interval: 5s
      retries: 12
    restart: unless-stopped

  # 사진 저장소(S3 호환 RustFS, 개발 정책 7장). 앱은 터널의 files 주소로 직접 올리고 받는다.
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: wadadak
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?GitHub Secrets에 STORAGE_SECRET_KEY가 없다}
    # 포트를 열지 않는다. 밖에서는 cloudflared(files 주소)를 거쳐서만 들어온다.
    volumes:
      - photos:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # 이벤트 브로커(개발 정책 5.7). core와 run이 서로 보내는 이벤트가 지나간다(EventBrokerConfig).
  rabbitmq:
    image: rabbitmq:4.1-alpine
    # 데이터 폴더가 노드 이름(rabbit@호스트 이름)별로 갈린다. 고정하지 않으면 컨테이너를 다시 만들 때 큐가 사라진다.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: wadadak
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD:?GitHub Secrets에 BROKER_PASSWORD가 없다}
    # run PC의 run 서비스만 Tailscale로 붙는다. 큐 확인: docker exec wadadak-server-rabbitmq-1 rabbitmqctl list_queues
    # 15692는 RabbitMQ 지표(rabbitmq_prometheus, 이미지 기본으로 켜져 있다). run PC 모니터링의 Prometheus가 DLQ 메시지 수를 읽는다.
    ports:
      - "100.75.79.15:5672:5672"
      - "100.75.79.15:15692:15692"
    volumes:
      - broker:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # core 서비스(member · course · ranking · review · notification). run 서비스와는 브로커 이벤트와 내부 API로 주고받는다.
  core:
    # 배포 작업이 GitHub 러너에서 빌드해 GHCR에 올린 이미지(BackEnd/services/core/Dockerfile). 되돌릴 때는 IMAGE_TAG=<커밋 SHA>.
    image: ghcr.io/sunmoonuniv/wadadak-core:${IMAGE_TAG:-main}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # core는 run 계정을 쓰지 않는다. compose up --wait는 끝난 컨테이너를 실패로 보는데,
      # service_completed_successfully로 기다리는 서비스가 있으면 한 번 돌고 끝나는 작업으로 보고 넘어간다.
      db-init:
        condition: service_completed_successfully
    environment:
      # 스텁(app.stub.*: true)이나 가짜 소셜 검증이 켜져 있으면 기동을 막는다(StubGuard).
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/wadadak
      DB_USERNAME: wadadak
      DB_PASSWORD: ${DB_PASSWORD}
      # PEM 파일을 base64 한 줄로 받는다(Spring Boot의 base64: 리소스). 파일 없이 키를 넘긴다.
      JWT_PUBLIC_KEY_LOCATION: base64:${JWT_PUBLIC_KEY:?GitHub Secrets에 JWT_PUBLIC_KEY가 없다}
      JWT_PRIVATE_KEY_LOCATION: base64:${JWT_PRIVATE_KEY:?GitHub Secrets에 JWT_PRIVATE_KEY가 없다}
      # cloudflared가 넘기는 X-Forwarded-*로 https 주소를 만든다(Swagger의 서버 주소 등).
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # 요청마다 한 줄 로그(RequestLogFilter). 앱이 받은 응답을 서버에서 확인한다.
      APP_COMMON_REQUESTLOG_ENABLED: "true"
      # 서버는 저장소를 compose 안에서 부르고, 앱에는 터널 주소를 준다.
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_PUBLIC_URL: https://files.leedohyunn8n.shop
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      # 운영자 웹(/admin) 공용 계정. 비어 있으면 서버는 그대로 뜨고 운영자 API만 401이다.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # run 서비스와 이벤트를 주고받는다(EventBrokerConfig). 브로커가 꺼져도 서버는 뜨고 아웃박스에서 재전송한다.
      EVENTS_EXTERNALIZATION_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${BROKER_PASSWORD}
      # run 서비스가 부르는 내부 API(/internal/v1/**). 밖에서는 gateway가 막는다.
      INTERNAL_API_ENABLED: "true"
      # 푸시(FCM) 서비스 계정 키. 배포 작업이 Secrets의 FCM_SERVICE_ACCOUNT로 base64:… 를 만든다.
      # 비어 있으면 서버는 그대로 뜨고 푸시만 로그로 남긴다(PushConfig).
      FCM_CREDENTIALS_LOCATION: ${FCM_CREDENTIALS_LOCATION:-}
      # 코스 자동 생성의 길찾기. graphhopper가 내려가도 서버는 뜨고 자동 생성만 실패한다(depends_on을 걸지 않는다)
      GRAPHHOPPER_URL: http://graphhopper:8989
      # 코스 자동 생성의 장소 검색(NAVER API HUB 지역 검색 · NCP 지오코딩) 키.
      # 비어 있으면 서버는 그대로 뜨고 장소 입력만 못 찾는다(현재 위치 출발은 된다).
      NAVER_SEARCH_CLIENT_ID: ${NAVER_SEARCH_CLIENT_ID:-}
      NAVER_SEARCH_CLIENT_SECRET: ${NAVER_SEARCH_CLIENT_SECRET:-}
      NAVER_GEOCODE_CLIENT_ID: ${NAVER_GEOCODE_CLIENT_ID:-}
      NAVER_GEOCODE_CLIENT_SECRET: ${NAVER_GEOCODE_CLIENT_SECRET:-}
      # 문장 → 폼 보충용 Jev(TypeSafe) 키. 비어 있으면 규칙만 쓴다.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # 후보 오르막(평지 · 오르막 조건)용 표고점 파일. utilfile/elevation에 사람이 넣는다(README 7번). 없으면 평지 · 오르막만 반영하지 않는다
      PLANNER_SPOT_HEIGHTS: /elevation/spot_heights.bin
      # 인도 · 강변 · 밝은 길 조건용 칸 집합 파일 폴더. utilfile/layers에 사람이 넣는다(README 7번). 없는 파일의 조건만 반영하지 않는다
      PLANNER_LAYERS_DIR: /layers
    volumes:
      - ../utilfile/elevation:/elevation:ro
      - ../utilfile/layers:/layers:ro
    # 밖에서는 cloudflared → gateway를 거쳐서만 들어온다. run PC의 run 서비스만 Tailscale로 내부 API를 부른다.
    ports:
      - "100.75.79.15:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      start_interval: 3s
      retries: 3
    restart: unless-stopped

  # run 서비스 DB 계정(db-init.sql). 배포마다 한 번 돌고 끝난다. run PC 배포보다 먼저 돈다(backend.yml). 처음에만 계정을 만들고 소유자를 넘기며, 비밀번호는 매번 Secrets 값으로 맞춘다.
  db-init:
    # psql만 쓴다. postgres와 같은 이미지라 새로 받지 않는다.
    image: postgis/postgis:17-3.5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      RUN_DB_PASSWORD: ${RUN_DB_PASSWORD:?GitHub Secrets에 RUN_DB_PASSWORD가 없다}
    volumes:
      - ./db-init.sql:/db-init.sql:ro
    command: ["sh", "-c", "psql -h postgres -U wadadak -d wadadak -q -v run_pw=\"$$RUN_DB_PASSWORD\" -f /db-init.sql"]
    restart: "no"

  # 코스 자동 생성의 길찾기(GraphHopper 11.1 + 한국 OSM). 이미지는 core와 같은 JRE라 새로 받지 않는다.
  # jar · OSM 파일 · 미리 만든 그래프(graph-cache)는 저장소 밖 utilfile/graphhopper에 사람이 넣는다(README `길찾기 데이터`).
  # 배포 작업은 utilfile을 지우지 않는다(backend.yml). graph-cache가 없으면 기동 중에 그래프부터 만들다(약 4GB · 4분) 배포가 실패한다.
  graphhopper:
    image: eclipse-temurin:21-jre
    command: ["java", "-Xmx2g", "-jar", "/data/graphhopper-web-11.1.jar", "server", "/config.yml"]
    volumes:
      - ../utilfile/graphhopper:/data:ro
      - ../utilfile/graphhopper/graph-cache:/graph-cache
      - ./graphhopper/config.yml:/config.yml:ro
    # 포트를 열지 않는다. core만 서비스 이름으로 붙는다.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8989/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      start_interval: 3s
      retries: 3
    restart: unless-stopped

  # 게이트웨이(MSA 분리 4단계). 경로 라우팅(/api/v1/runs → run PC, 나머지 → core)과 /internal 차단(Caddyfile).
  gateway:
    image: caddy:2.10-alpine
    # Caddyfile이 바뀌어도 compose는 이 컨테이너를 다시 만들지 않는다. 배포 작업이 caddy reload로 다시 읽힌다(backend.yml).
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # 포트를 열지 않는다. 밖에서는 cloudflared를 거쳐서만 들어온다.
    # Caddy 자체가 떴는지만 본다(관리 주소). 서비스 상태는 각 서비스의 healthcheck가 본다.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3
    restart: unless-stopped

  # Cloudflare 터널. GitHub Secrets에 TUNNEL_TOKEN이 있을 때만 뜬다(배포 작업이 COMPOSE_PROFILES=tunnel을 켠다).
  # 터널의 공개 호스트 이름(api)은 서비스 주소 http://gateway:8080으로 보낸다(README 5번).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      # 상태 확인(tunnel ready)이 같은 주소를 본다.
      TUNNEL_METRICS: 127.0.0.1:20241
    # Cloudflare에 연결돼야 healthy. 토큰이 틀리면 배포 작업이 실패한다.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 3
    depends_on:
      core:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
  photos:
  broker:
