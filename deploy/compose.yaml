# 인프라 PC 실행 구성(러너 wadadak-infra). 절차는 deploy/README.md. 서버 PC는 셋이다.
#   인프라 PC 100.75.79.15: 진입점(cloudflared · gateway) · 브로커 · 사진 저장소 (이 파일)
#   core PC   100.64.78.38: core · graphhopper · core DB (deploy/core/compose.yaml)
#   run PC    100.73.249.33: run · run DB (deploy/run/compose.yaml)
# PC 사이는 Tailscale 사설망으로 잇는다. 다른 PC가 쓰는 rabbitmq · storage 포트는 이 PC의 Tailscale 주소에만 연다. 학교 LAN이나 밖에서는 닿지 않는다.
# 비밀값(STORAGE_SECRET_KEY · BROKER_PASSWORD · TUNNEL_TOKEN)은 배포 작업(backend.yml deploy-infra)이 GitHub Secrets에서 환경 변수로 넘긴다.
# 서버 PC에는 비밀값 파일을 두지 않는다.
# 프로젝트 이름을 바꾸지 않는다. 사진 · 브로커 볼륨(wadadak-server_photos · wadadak-server_broker)이 이 이름에 묶여 있어, 바꾸면 빈 저장소 · 빈 브로커로 뜬다.
name: wadadak-server

services:
  # 사진 저장소(S3 호환 RustFS, 개발 정책 7장). 앱은 터널의 files 주소로 직접 올리고 받는다.
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: wadadak
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?GitHub Secrets에 STORAGE_SECRET_KEY가 없다}
    # core PC의 core만 Tailscale로 붙는다(버킷 준비 · 사진 확인 · 삭제). 쓰기에는 비밀키가 필요하고 읽기는 원래 공개다.
    # 앱은 그대로 cloudflared(files 주소)를 거쳐 올리고 받는다.
    ports:
      - "100.75.79.15:9000:9000"
    volumes:
      - photos:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # 이벤트 브로커(개발 정책 5.7). core와 run이 서로 보내는 이벤트가 지나간다(EventBrokerConfig).
  rabbitmq:
    image: rabbitmq:4.1-alpine
    # 데이터 폴더가 노드 이름(rabbit@호스트 이름)별로 갈린다. 고정하지 않으면 컨테이너를 다시 만들 때 큐가 사라진다.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: wadadak
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD:?GitHub Secrets에 BROKER_PASSWORD가 없다}
    # core PC의 core와 run PC의 run이 Tailscale로 붙는다. 큐 확인: docker exec wadadak-server-rabbitmq-1 rabbitmqctl list_queues
    # 15692는 RabbitMQ 지표(rabbitmq_prometheus, 이미지 기본으로 켜져 있다). run PC 모니터링의 Prometheus가 DLQ 메시지 수를 읽는다.
    ports:
      - "100.75.79.15:5672:5672"
      - "100.75.79.15:15692:15692"
    volumes:
      - broker:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # 게이트웨이(MSA 분리 4단계). 경로 라우팅(/api/v1/runs → run PC, 나머지 → core PC)과 /internal 차단(Caddyfile).
  gateway:
    image: caddy:2.10-alpine
    # Caddyfile이 바뀌어도 compose는 이 컨테이너를 다시 만들지 않는다. 배포 작업이 caddy reload로 다시 읽힌다(backend.yml).
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # 포트를 열지 않는다. 밖에서는 cloudflared를 거쳐서만 들어온다.
    # Caddy 자체가 떴는지만 본다(관리 주소). 서비스 상태는 각 서비스의 healthcheck가 본다.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3
    restart: unless-stopped

  # Cloudflare 터널. GitHub Secrets에 TUNNEL_TOKEN이 있을 때만 뜬다(배포 작업이 COMPOSE_PROFILES=tunnel을 켠다).
  # 터널의 공개 호스트 이름은 api → http://gateway:8080, files → http://storage:9000으로 보낸다(README 5번).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      # 상태 확인(tunnel ready)이 같은 주소를 본다.
      TUNNEL_METRICS: 127.0.0.1:20241
    # Cloudflare에 연결돼야 healthy. 토큰이 틀리면 배포 작업이 실패한다.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 3
    # core는 다른 PC라 기다리지 않는다. core가 내려가 있으면 gateway가 502로 답한다.
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  photos:
  broker:
