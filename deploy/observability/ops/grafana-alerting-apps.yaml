# 와다닥 앱 알림 (Grafana 파일 provisioning): 앱 지표 · 상태 확인 탐침(Prometheus), 로그(Loki).
# 연락 지점은 grafana-alerting-dlq.yaml의 wadadak-discord를 같이 쓴다.
# 제목 · 내용은 그 파일 템플릿의 기본 갈래를 탄다(제목 "⚠️ 규칙 이름", 내용 summary).
# Grafana는 이 파일을 기동할 때만 읽는다. 고친 뒤에는 운영 PC에서 docker compose restart grafana.
apiVersion: 1

groups:
  - orgId: 1
    name: apps
    folder: Wadadak
    interval: 30s
    rules:
      # 1) 수집 중단: core 또는 run의 /actuator/prometheus를 2분 동안 못 읽음. 서버가 멈췄거나 그 PC · Tailscale 연결이 끊긴 경우다.
      #    배포로 컨테이너가 다시 뜨는 수십 초는 for: 2m 으로 넘긴다.
      - uid: wadadak-app-down
        title: 서비스 지표 수집 중단
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: wadadak-prometheus
            model:
              refId: A
              editorMode: code
              expr: 'up{job="wadadak-apps"}'
              instant: true
              range: false
              legendFormat: '{{service}}'
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: KeepLast
        for: 2m
        labels:
          wadadak_alert: app-down
        annotations:
          summary: '{{ .Labels.service }}({{ .Labels.instance }}) 지표를 읽지 못합니다. 서버가 멈췄거나 그 PC · Tailscale 연결이 끊겼을 수 있습니다. 그 PC에서 docker compose ps를 봅니다.'
          __dashboardUid__: wadadak-apps
          __panelId__: '1'
        notification_settings:
          receiver: wadadak-discord
          group_by: [alertname, service]
          group_wait: 30s
          group_interval: 1m
          repeat_interval: 4h
        isPaused: false

      # 2) 5xx 비율: 5분 동안 서버 오류가 5%를 넘음. 요청이 분당 3건 미만이면 보지 않는다(한두 건 오류로 울리지 않게).
      - uid: wadadak-app-5xx
        title: 서버 오류(5xx) 비율 높음
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: wadadak-prometheus
            model:
              refId: A
              editorMode: code
              expr: >-
                (sum by (service) (rate(http_server_requests_seconds_count{job="wadadak-apps", status=~"5.."}[5m]))
                  / sum by (service) (rate(http_server_requests_seconds_count{job="wadadak-apps"}[5m])))
                and on (service) sum by (service) (rate(http_server_requests_seconds_count{job="wadadak-apps"}[5m])) > 0.05
              instant: true
              range: false
              legendFormat: '{{service}}'
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        labels:
          wadadak_alert: app-5xx
        annotations:
          summary: '{{ .Labels.service }}의 5xx 응답이 5분 동안 5%를 넘었습니다. 그 서비스 로그(docker logs)와 대시보드 "와다닥 앱 지표"를 봅니다.'
          __dashboardUid__: wadadak-apps
          __panelId__: '3'
        notification_settings:
          receiver: wadadak-discord
          group_by: [alertname, service]
          group_wait: 30s
          group_interval: 1m
          repeat_interval: 4h
        isPaused: false

      # 3) 메모리 압박: GC 뒤에도 남는 오래된 객체가 최대치의 90%를 10분 넘게 넘음. 곧 OutOfMemoryError가 날 수 있다.
      - uid: wadadak-app-memory
        title: JVM 메모리 부족
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: wadadak-prometheus
            model:
              refId: A
              editorMode: code
              expr: 'max by (service) (jvm_gc_live_data_size_bytes{job="wadadak-apps"}) / max by (service) (jvm_gc_max_data_size_bytes{job="wadadak-apps"})'
              instant: true
              range: false
              legendFormat: '{{service}}'
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.9] }
        noDataState: OK
        execErrState: KeepLast
        for: 10m
        labels:
          wadadak_alert: app-memory
        annotations:
          summary: '{{ .Labels.service }}에서 GC 뒤에도 남는 메모리가 10분 넘게 최대치의 90%를 넘습니다. 곧 OutOfMemoryError가 날 수 있습니다.'
          __dashboardUid__: wadadak-apps
          __panelId__: '7'
        notification_settings:
          receiver: wadadak-discord
          group_by: [alertname, service]
          group_wait: 30s
          group_interval: 1m
          repeat_interval: 4h
        isPaused: false

      # 4) 상태 확인 실패: blackbox 탐침(prometheus.yml wadadak-probe)이 2분 동안 실패. 대상 주소마다 따로 울린다.
      #    1번(지표 수집 중단)이 울리는 서비스는 탐침을 빼서 같은 장애로 두 번 울리지 않는다. storage는 1번과 상관없다.
      #    탐침 결과가 하나도 없으면(blackbox · Prometheus 문제) 그것도 알린다.
      - uid: wadadak-probe-down
        title: 상태 확인 실패
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: wadadak-prometheus
            model:
              refId: A
              editorMode: code
              expr: 'probe_success{job="wadadak-probe"} unless on (service) (up{job="wadadak-apps"} == 0)'
              instant: true
              range: false
              legendFormat: '{{probe}} {{service}}'
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: KeepLast
        for: 2m
        labels:
          wadadak_alert: probe-down
        annotations:
          summary: >-
            {{ if not .Labels.instance }}탐침 결과가 하나도 없습니다. 운영 PC의 blackbox · prometheus 컨테이너를 봅니다.
            {{- else if eq .Labels.probe "entry" }}바깥 주소 {{ .Labels.instance }} 에 닿지 못합니다(사용자와 같은 길).
            같은 서비스의 직접 확인도 실패하면 그 서비스 문제, 직접은 정상이면 진입 경로(Cloudflare · 인프라 PC cloudflared{{ if eq .Labels.service "core" }} · gateway{{ end }}) 문제입니다.
            {{- else if eq .Labels.service "storage" }}사진 저장소(RustFS) {{ .Labels.instance }} 가 응답하지 않습니다. 인프라 PC에서 docker compose ps storage를 봅니다.
            {{- else }}{{ .Labels.service }} 서버는 떠 있는데 health({{ .Labels.instance }})가 UP이 아닙니다. DB가 내려갔을 수 있습니다. 그 PC에서 docker compose ps postgres를 봅니다.{{ end }}
        notification_settings:
          receiver: wadadak-discord
          group_by: [alertname, instance]
          group_wait: 30s
          group_interval: 1m
          repeat_interval: 4h
        isPaused: false

  # 로그 알림(Loki). Alloy가 보내는 요약 줄만 본다(observability/README.md "수집하는 것"). 원문은 그 PC에서 docker logs로 본다.
  # 줄이 하나라도 보이면 바로 울리고, 5분 동안 새 줄이 없으면 해제된다.
  - orgId: 1
    name: logs
    folder: Wadadak
    interval: 1m
    rules:
      # 5) core 로그: 모든 ERROR, 그리고 따로 알아야 하는 WARN 둘.
      #    EventMonitor는 10분 넘게 처리되지 않은 이벤트(아웃박스), PlannerService는 길찾기 서버(GraphHopper) 무응답이다.
      #    로그가 없으면(NoData) logger 라벨이 없다. match에는 .Labels.logger 대신 index로 넘긴다(없으면 빈 문자열).
      - uid: wadadak-log-core
        title: core 로그 경보
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: wadadak-loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum by (level, logger) (count_over_time({service="core"} |~ `^Spring (ERROR \S+|WARN \S*(EventMonitor|PlannerService))$` | pattern `Spring <level> <logger>` [5m]))'
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        labels:
          wadadak_alert: log-core
        annotations:
          summary: >-
            {{ if match "EventMonitor$" (index .Labels "logger") }}core에 10분 넘게 처리되지 않은 이벤트가 있습니다. 대시보드 "와다닥 RabbitMQ DLQ"의 업무 큐와 core PC docker logs를 봅니다.
            {{- else if match "PlannerService$" (index .Labels "logger") }}길찾기 서버(GraphHopper)가 응답하지 않아 코스 자동 생성이 실패합니다. core PC에서 docker compose ps graphhopper를 봅니다.
            {{- else }}core에서 ERROR 로그가 났습니다: {{ .Labels.logger }}. 내용은 core PC에서 docker logs로 봅니다.{{ end }}
        notification_settings:
          receiver: wadadak-discord
          group_by: [alertname, logger]
          group_wait: 30s
          group_interval: 1m
          repeat_interval: 4h
        isPaused: false

      # 6) run 작업 실패: run PC Alloy는 기동 줄과 작업 실패 줄 셋만 보낸다(run/config.alloy).
      #    regexp는 줄을 거르지 않는다(안 맞는 줄도 failure="" 로 센다). 그래서 |~ 로 먼저 거른다.
      - uid: wadadak-log-run
        title: run 작업 실패
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: wadadak-loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum by (failure) (count_over_time({service="run"} |~ `^(Free run processing|GPS gap check|Run event publication) failed for ` | regexp `^(?P<failure>.+ failed) for ` [5m]))'
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        labels:
          wadadak_alert: log-run
        annotations:
          summary: 'run에서 "{{ .Labels.failure }}" 로그가 났습니다. 기록 ID와 원문은 run PC에서 docker logs로 봅니다.'
        notification_settings:
          receiver: wadadak-discord
          group_by: [alertname, failure]
          group_wait: 30s
          group_interval: 1m
          repeat_interval: 4h
        isPaused: false
