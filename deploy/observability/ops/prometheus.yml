# 운영 PC 감시 Prometheus. 인프라 PC RabbitMQ의 큐별 메시지 수 · 소비자(consumer) 수와 core · run 앱 지표를 수집한다.
# 대상: 인프라 PC Tailscale 주소의 15692(rabbitmq_prometheus).
# host 라벨 core-pc는 서버 2대 때 이름이다. 바꾸면 DLQ 잔류 규칙(last_over_time 7일)이 옛 시계열을 7일 동안 따로 본다.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rabbitmq-dlq
    # 기본 /metrics는 전체 합계라 큐별 값이 없다. 큐별 값은 /metrics/detailed에서 family로 고른다.
    metrics_path: /metrics/detailed
    params:
      vhost: ["/"]
      # queue_coarse_metrics: 메시지 수, queue_consumer_count: 큐를 지켜보는 소비자 수(core·run이 RabbitMQ에서 떨어졌는지)
      family: ["queue_coarse_metrics", "queue_consumer_count"]
    static_configs:
      - targets: ["100.75.79.15:15692"]
        labels:
          host: core-pc
    # 큐 깊이(ready + unacked)와 소비자 수만 남긴다. up은 Prometheus가 따로 만들므로 이 필터와 상관없이 남는다.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: rabbitmq_detailed_queue_messages|rabbitmq_detailed_queue_consumers
        action: keep

  # core · run 앱 지표(/actuator/prometheus, Spring Boot Actuator + Micrometer). Tailscale로 직접 읽는다.
  # 게이트웨이(deploy/Caddyfile)는 /actuator/health 말고는 막아 밖에서는 보이지 않는다.
  - job_name: wadadak-apps
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["100.64.78.38:8080"]
        labels:
          service: core
          host: core-pc
      - targets: ["100.73.249.33:8080"]
        labels:
          service: run
          host: run-pc

  # 상태 확인 탐침(blackbox.yml). probe=entry는 사용자와 같은 바깥 길(Cloudflare → cloudflared → gateway/storage),
  # probe=direct는 Tailscale로 그 서비스에 바로 간다. 둘을 같이 보면 어느 구간이 끊겼는지 가를 수 있다.
  # Spring health는 DB 연결을 본다(rabbit 검사는 끔). 서버는 떠 있는데 DB가 내려간 경우를 여기서 잡는다.
  - job_name: wadadak-probe
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [health]
    static_configs:
      - targets: ["https://api.leedohyunn8n.shop/actuator/health"]
        labels: { service: core, probe: entry }
      - targets: ["http://100.64.78.38:8080/actuator/health"]
        labels: { service: core, probe: direct }
      - targets: ["http://100.73.249.33:8080/actuator/health"]
        labels: { service: run, probe: direct }
      - targets: ["https://files.leedohyunn8n.shop/health"]
        labels: { service: storage, probe: entry }
      - targets: ["http://100.75.79.15:9000/health"]
        labels: { service: storage, probe: direct }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
