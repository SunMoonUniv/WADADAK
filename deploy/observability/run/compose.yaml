name: wadadak-run-observability

x-container-defaults: &container-defaults
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  loki:
    <<: *container-defaults
    image: grafana/loki:3.7.2
    command: ["-config.file=/etc/loki/wadadak.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/wadadak.yaml:ro
      - loki-data:/loki

  grafana:
    <<: *container-defaults
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run PC .env에 GRAFANA_ADMIN_PASSWORD가 없다}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_BIND_IP:-127.0.0.1}:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/wadadak.yaml:ro
      - ./dashboards:/etc/grafana/wadadak-dashboards:ro

  alloy:
    <<: *container-defaults
    image: grafana/alloy:v1.21.0
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

  smoke:
    profiles: [smoke]
    image: busybox:1.37.0
    command: ["sh", "-c", "printf 'WADADAK_OBSERVABILITY_SMOKE %s\\n' \"$$(date -u +%Y%m%dT%H%M%SZ)\"; sleep 180"]

volumes:
  loki-data:
  grafana-data:
  alloy-data:
