# run PC 로그 수집(Alloy). run 컨테이너의 요약 줄을 운영 PC Loki로 보낸다. 절차는 run/README.md.
# 프로젝트 이름을 바꾸지 않는다. Alloy 읽기 위치 볼륨(wadadak-run-observability_alloy-data)을 이어 쓴다.
name: wadadak-run-observability

x-container-defaults: &container-defaults
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  alloy:
    <<: *container-defaults
    image: grafana/alloy:v1.21.0
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://100.111.111.92:3100/loki/api/v1/push}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

  smoke:
    profiles: [smoke]
    image: busybox:1.37.0
    command: ["sh", "-c", "printf 'WADADAK_OBSERVABILITY_SMOKE %s\\n' \"$$(date -u +%Y%m%dT%H%M%SZ)\"; sleep 180"]

volumes:
  alloy-data:
