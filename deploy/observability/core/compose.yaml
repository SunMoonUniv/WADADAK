name: wadadak-core-observability

services:
  alloy:
    image: grafana/alloy:v1.21.0
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://100.73.249.33:3100/loki/api/v1/push}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  smoke:
    profiles: [smoke]
    image: busybox:1.37.0
    network_mode: none

volumes:
  alloy-data:
