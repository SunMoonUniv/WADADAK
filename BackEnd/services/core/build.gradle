plugins {
    id 'org.springframework.boot'
}

// core 서비스: member · course · ranking · review · notification
dependencies {
    implementation project(':libs:common-core')
    implementation project(':libs:common-region')
    implementation project(':libs:common-storage')
    implementation project(':libs:event')
    implementation project(':libs:course-api')
    implementation project(':libs:ranking-api')
    // shortcut: 전환(MSA 분리 4단계) 전까지 run을 함께 담아 지금 모놀리스와 같은 이미지를 낸다. 전환 PR에서 이 줄을 지운다
    implementation project(':modules:run')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'org.springframework.modulith:spring-modulith-observability-api'
    implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
    // 이벤트 외부화(MSA 1단계): run이 주고받는 이벤트를 RabbitMQ에도 발행한다(개발 정책 5.7)
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.modulith:spring-modulith-events-amqp'
    // FCM HTTP v1 액세스 토큰(서비스 계정 키 → Google OAuth). Firebase Admin SDK는 Firestore 등까지 딸려 와서 인증만 쓴다(notification)
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.48.0'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
    runtimeOnly 'org.springframework.modulith:spring-modulith-observability-core'

    testImplementation testFixtures(project(':libs:common-core'))
}
