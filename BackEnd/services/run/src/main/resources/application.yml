# run 서비스(MSA 분리 4단계, 개발 정책 11.3 · deploy/MSA 분리 준비와 CI·CD 5장). 배포 설정은 deploy/compose.yaml.
spring:
  application:
    name: wadadak-run
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/wadadak}
    # 운영은 run PC의 run 전용 DB 소유자 wadadak_run이다(deploy/run/compose.yaml). 기본값을 두지 않는다.
    # 로컬은 BackEnd/compose.yaml의 계정을 환경 변수로 넘긴다.
    username: ${RUN_DB_USERNAME}
    password: ${RUN_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # 엔티티는 @Table(schema = "run")이다. 기본 스키마는 Modulith 아웃박스(run.event_publication)용이다.
        default_schema: run
        jdbc:
          time_zone: UTC
  flyway:
    # run 마이그레이션만 읽는다. 기본값(db/migration)은 common-core jar의 db/migration/common까지 읽는다.
    locations: classpath:db/migration/run
    default-schema: run
    out-of-order: true
    # 운영 DB의 run 스키마는 모놀리스가 만들어 이력이 common.flyway_schema_history에 있다.
    # 처음 뜰 때 run 스키마에 이력 테이블만 만들고 이 버전까지는 적용된 것으로 본다. 전환 때 마지막 run 마이그레이션이다.
    # 이후 run 마이그레이션은 이 버전보다 뒤여야 한다.
    baseline-on-migrate: true
    baseline-version: "20261112.2000"
  modulith:
    events:
      completion-mode: delete
      republish-outstanding-events-on-restart: true
      # 서비스 사이 이벤트(EventBrokerConfig). 보내기와 받기를 함께 켠다. 테스트는 끄고 공용 서버(deploy/compose.yaml)에서 켠다.
      externalization:
        enabled: ${EVENTS_EXTERNALIZATION_ENABLED:false}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USERNAME:wadadak}
    # 기본값을 두지 않는다. 브로커를 켜는 곳(공용 서버 compose)에서만 넘긴다.
    password: ${RABBITMQ_PASSWORD:}
    template:
      observation-enabled: true
    listener:
      simple:
        # 받는 쪽도 traceId를 잇는다(개발 정책 5.7)
        observation-enabled: true
        # 실패한 메시지를 큐에 되돌리지 않고 DLQ로 보낸다. 되돌리면 DB가 내려가 있는 동안 끝없이 돈다
        default-requeue-rejected: false
        retry:
          enabled: true
          # 1초부터 두 배씩, 최대 1분 간격으로 10번(약 6분) 다시 시도한 뒤 실패 사유를 헤더에 붙여 DLQ(EventBrokerConfig.failedEventRecoverer)
          initial-interval: 1s
          multiplier: 2
          max-interval: 1m
          max-retries: 10
  security:
    oauth2:
      resourceserver:
        jwt:
          # 공개키만 받는다. 토큰 발급(개인키)은 core의 member만 한다(7.4).
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:${app.local-dir:.local}/jwt/public.pem}
          audiences: wadadak

management:
  health:
    rabbit:
      # 브로커가 꺼져도 서버는 healthy다. 외부화 행은 아웃박스에 남아 재전송된다.
      enabled: false

app:
  common:
    request-log:
      enabled: false
    shedlock:
      table: run.shedlock
  run:
    # core 내부 API. 같은 PC(7장)는 http://core:8080, 서버 2대(8장)는 core 서버의 사설 주소
    core-api:
      base-url: ${CORE_API_URL:http://localhost:8080}
      timeout: 3s
