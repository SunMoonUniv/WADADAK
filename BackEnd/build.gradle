import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    set('springModulithVersion', "2.1.1")
    set('springdocVersion', "3.1.1")
    set('shedlockVersion', "7.10.1")
}

// 모든 서브프로젝트 공통. jar는 java-library 그대로, 실행 서비스만 Spring Boot 플러그인을 붙인다(개발 정책 3.3).
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    // services:run과 modules:run은 이름이 같다. group이 같으면 Gradle이 같은 모듈로 보고 자기 자신을 의존한다
    group = "com.wadadak.${project.parent.name}"
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
        testImplementation 'org.springframework.boot:spring-boot-testcontainers'
        testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
        testImplementation 'org.testcontainers:testcontainers-postgresql'
        testImplementation 'org.testcontainers:testcontainers-rabbitmq'
        testCompileOnly 'org.projectlombok:lombok'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testAnnotationProcessor 'org.projectlombok:lombok'
    }

    tasks.named('test') {
        useJUnitPlatform()
        // 테스트의 상대 경로(../run/fixtures, ../utilfile, build/)는 BackEnd 기준이다. 프로젝트가 나뉘어도 그대로 둔다.
        workingDir = rootProject.projectDir
    }

    // 로컬 키(.local) · utilfile 기본 경로도 BackEnd 기준이다
    plugins.withId('org.springframework.boot') {
        tasks.named('bootRun') {
            workingDir = rootProject.projectDir
        }
    }
}
