name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # verify(), 모듈 단독 기동 테스트 포함. Testcontainers는 러너의 Docker를 쓴다.
      - run: ./gradlew test
