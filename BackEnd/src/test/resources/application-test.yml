spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:jwt/test-public.pem

app:
  admin:
    username: test-admin
    password: test-admin-password
  member:
    jwt:
      private-key-location: classpath:jwt/test-private.pem
    social:
      fake: true
  # 테스트가 넣은 지난 날짜 코스를 배치가 숨기지 않게 끈다. 만료 배치 테스트는 메서드를 직접 부른다.
  course:
    retention-batch:
      enabled: false
    # 로컬에 utilfile이 있어도 CI와 같게 표고점 없이 돈다. 오르막 시험은 SpotHeights를 직접 만든다.
    planner:
      spot-heights: ../BackEnd/build/no-spot-heights.bin
  # 시험이 넣은 발송 줄을 발송 작업이 먼저 보내지 않게 끈다. 발송 시험은 PushDispatcher를 직접 부른다.
  notification:
    dispatch:
      enabled: false
