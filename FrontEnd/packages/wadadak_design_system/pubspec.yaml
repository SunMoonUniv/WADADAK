name: wadadak_design_system
description: 와다닥 디자인 시스템 — Figma "몰입형 디자인" 토큰과 공통 컴포넌트의 Flutter 구현.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/
  # Pretendard v1.3.9 (SIL OFL 1.1 — assets/fonts/OFL-Pretendard.txt)
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
