# MSA 이후 부하 테스트(loadtest/README.md 4번)의 인프라 PC 쪽. 운영 브로커(5672) 옆에 부하용 브로커를 5673에 띄운다.
# 큐는 core · run이 뜰 때 만든다. 볼륨 없이 띄워 테스트가 끝나면 그대로 버린다.
name: wadadak-lt

services:
  rabbitmq:
    image: rabbitmq:4.1-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: wadadak
      RABBITMQ_DEFAULT_PASS: wadadak
    ports:
      - "100.75.79.15:5673:5672"
