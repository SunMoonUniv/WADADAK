# MSA 이후 부하 테스트(loadtest/README.md 4번)의 core PC 쪽. 운영 core를 멈추고 이 PC에서 띄운다(프로젝트 이름 wadadak-lt).
# 운영 이미지 그대로, 빈 부하용 DB · 가짜 소셜 로그인 · 부하용 JWT 키(.env)로 뜬다. 운영 DB 볼륨은 건드리지 않는다.
# 포트는 Tailscale 주소의 18080이라 게이트웨이(운영 8080)로는 들어오지 않는다.
name: wadadak-lt

services:
  db:
    image: postgis/postgis:17-3.5
    command: ["postgres", "-c", "max_connections=200"]
    shm_size: 1g
    environment:
      POSTGRES_DB: wadadak
      POSTGRES_USER: wadadak
      POSTGRES_PASSWORD: wadadak
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wadadak -d wadadak"]
      interval: 5s
      retries: 12

  core:
    image: ghcr.io/sunmoonuniv/wadadak-core:main
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    environment:
      # prod 프로필은 가짜 로그인을 막는다(StubGuard). 나머지는 deploy/core/compose.yaml과 같게 둔다
      DB_URL: jdbc:postgresql://db:5432/wadadak
      APP_MEMBER_SOCIAL_FAKE: "true"
      JWT_PUBLIC_KEY_LOCATION: base64:${LT_JWT_PUBLIC_KEY:?.env에 LT_JWT_PUBLIC_KEY가 없다}
      JWT_PRIVATE_KEY_LOCATION: base64:${LT_JWT_PRIVATE_KEY:?.env에 LT_JWT_PRIVATE_KEY가 없다}
      EVENTS_EXTERNALIZATION_ENABLED: "true"
      RABBITMQ_HOST: 100.75.79.15
      SPRING_RABBITMQ_PORT: "5673"
      INTERNAL_API_ENABLED: "true"
      # ramp.py가 PC CPU(system.cpu.usage)를 읽는다
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics,prometheus
    ports:
      - "100.64.78.38:18080:8080"

volumes:
  db:
