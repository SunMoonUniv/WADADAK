purpose:
  stands_in_for: Read-only own and public ghost playback response transport.
  unblocks: Validate real Dio transport and replay parsing for JSON above the 50KiB background-worker threshold.
assumptions:
  - id: immutable-large-replay
    status: supported
    claim: The local stand-in provides the own/public replay envelopes used by the application, including continuous millisecond spans.
    reason: Shapes were derived from the production API classes and existing replay fixtures. This stand-in does not establish live server latency or authentication behavior.
    verification: On 2026-11-05 actual Dio and OwnGhostApi/PublicGhostApi consumed 3600- and 7200-sample streamed JSON responses (618KiB and 1.24MB), produced eligible usable replays, and retained 404 rejection for deleted records. Six request events were confirmed in the local simulation log. Live public playback also reached preparation on Galaxy S21; the user's own live record was rejected for GPS gaps, so normal live-own preparation remains unverified for that record.
    source: FrontEnd/app/lib/features/run/data/own_ghost_api.dart; FrontEnd/app/lib/features/run/data/public_ghost_api.dart; FrontEnd/app/lib/features/run/domain/public_ghost.dart
    updated_at: '2026-11-05'
  - id: observed-course-detour
    status: supported
    claim: Eligible course replays can retain positionless UNKNOWN spans for GPS-observed detours while excluding those spans from quality gap totals.
    reason: The server keeps the existing span wire format for own and public course replays. The local stand-in extends the repository's existing mock with a synthetic detour. Workspace mock discovery was skipped because the CLI is signed out.
    verification: On 2026-11-10 the Flutter HTTP test received 200 from both local playback routes, decoded the eligible replay, hid the position inside the 28-second detour, and restored it at the return fix. The simulation logged both requests. This verifies the client against the local stand-in.
    source: BackEnd/src/main/java/com/wadadak/run/internal/ghost/GhostPlaybackBuilder.java, postman/mocks/ghost-replay/default.js, FrontEnd/app/test/run/ghost_large_response_transport_test.dart
    updated_at: '2026-11-10'
